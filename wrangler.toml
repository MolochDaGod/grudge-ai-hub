# ═══════════════════════════════════════════════════════════════════════════
# API path worker — same code as grudge-ai-hub (domain owner)
# ═══════════════════════════════════════════════════════════════════════════
# Prefer canonical https://ai.grudge-studio.com for all clients.
# This worker keeps /v1/* + /health path routes as high-priority API edge
# (Gemini BYOK secrets historically lived here first).
#
# Deploy both: npm run deploy
# Domain only:  npm run deploy:domain
# API only:     npm run deploy:api

name               = "grudge-legion-ai"
main               = "index.js"
# Workers best-practices: keep date current; nodejs_compat for Buffer/crypto interop
compatibility_date = "2026-03-01"
compatibility_flags = ["nodejs_compat"]
account_id         = "ee475864561b02d4588180b8b9acf694"
workers_dev        = true

# CF Workers observability (logs/traces sampling)
[observability]
enabled = true
head_sampling_rate = 1

[ai]
binding = "AI"

[[d1_databases]]
binding       = "DB"
database_name = "grudge-ai-hub"
database_id   = "42ada55e-2095-46da-840b-6bb301a57253"

[[kv_namespaces]]
binding = "KV"
id      = "486553dfacdc40b394e630b1cdfa97d6"

# Secrets (wrangler secret put …) — also run scripts/set-gemini-secret.ps1
# OBSERVATORY_KEY, GEMINI_API_KEY, VPS_INTERNAL_KEY, WORKERS_AI_USER_TOKEN
# Never put secrets in [vars] or git.

[vars]
ENVIRONMENT              = "production"
DEFAULT_AI_MODEL         = "google/gemini-3.5-flash"
FALLBACK_AI_MODEL        = "@cf/meta/llama-3.1-8b-instruct-fast"
CLOUDFLARE_ACCOUNT_ID    = "ee475864561b02d4588180b8b9acf694"
VPS_ENABLED              = "false"
VPS_AI_AGENT_URL         = ""
RATE_LIMIT_RPM           = "60"
RATE_LIMIT_RPM_ADMIN     = "300"
MAX_PAYLOAD_BYTES        = "1048576"
UI_ORIGIN                = "https://grudge-agent.vercel.app"
# Fleet telemetry — prefer env override; DNS obs.grudge-studio.com may be pending
OBSERVATORY_URL          = "https://grudge-fleet-harbor.grudge.workers.dev/api/observatory"

# Specific path routes on canonical host (win over catch-all custom domain)
[[routes]]
pattern = "ai.grudge-studio.com/v1/*"
zone_id = "e8c0c2ee3063f24eb31affddabf9730a"

[[routes]]
pattern = "ai.grudge-studio.com/health"
zone_id = "e8c0c2ee3063f24eb31affddabf9730a"

[[routes]]
pattern = "ai.grudge-studio.com/api/health"
zone_id = "e8c0c2ee3063f24eb31affddabf9730a"

# ── Staging ───────────────────────────────────────────────────────────────────
[env.staging]
name = "grudge-ai-hub-staging"

[env.staging.vars]
ENVIRONMENT = "staging"
